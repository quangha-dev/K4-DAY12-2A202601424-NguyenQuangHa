name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  API_TOKEN: ci-dummy
  REDIS_URL: fake://

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline checkpoints
        run: >-
          python -m pytest tests/
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py
          -m "not docker"

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag day12-chat:${{ github.sha }} .

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger Render deploy
        run: >-
          curl --fail --show-error --silent
          --request POST
          "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for healthy deployment
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "${PUBLIC_URL}/healthz"; then
              exit 0
            fi
            sleep 10
          done
          echo "Render deployment did not become healthy in time" >&2
          exit 1

  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > ~/.ssh/day12_deploy
          printf '%s\n' "${VPS_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/day12_deploy ~/.ssh/known_hosts

      - name: Deploy exact commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/day12_deploy \
            -o BatchMode=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "set -e; cd /opt/k4-day12; git fetch origin main; git checkout -B main '${GITHUB_SHA}'; DEPLOY_SHA='${GITHUB_SHA}' bash scripts/deploy_vps.sh"

      - name: Verify public VPS service
        env:
          VPS_PUBLIC_URL: ${{ vars.VPS_PUBLIC_URL }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "${VPS_PUBLIC_URL}/healthz"; then
              exit 0
            fi
            sleep 5
          done
          echo "VPS deployment did not become healthy in time" >&2
          exit 1
