# CP5 — Cấu hình deploy Render (dùng nếu bạn chọn Render).
#
# Render đọc file này khi bạn tạo Blueprint từ repo GitHub.
# `sync: false` = Render hỏi giá trị lúc deploy, KHÔNG lưu secret vào repo.

services:
  - type: web
    name: k4-day12-2a202601424-nguyenquangha
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeployTrigger: off
    healthCheckPath: /healthz
    envVars:
      - key: API_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: BUCKET_CAPACITY
        value: "10"
      - key: REFILL_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: REDIS_URL
        fromService:
          name: k4-day12-redis-2a202601424
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: k4-day12-redis-2a202601424
    plan: free
    region: singapore
    ipAllowList: []
